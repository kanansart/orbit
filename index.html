<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFE9F1">
<link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orbit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Orbit</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
/*
 * ORBIT | SINGLE-FILE EDITION
 * =============================================================
 * QUICK MAP
 *   1. Base design tokens, global elements and UI components
 *   2. Book covers, paper, photo album and animations
 *   3. Feature-specific and historical visual refinements
 *   4. CURRENT THEME: final palette, app canvas, navigation, dates,
 *      Rijul's cover and matching interior stripes
 *
 * CSS is intentionally kept in its original cascade order. Moving
 * overlapping selectors can change the design even when their
 * declarations look identical. Edit CURRENT THEME for colours.
 * User a = Kanan; user b = Rijul.
 */

:root {
  --bg: #FFF8DC;
  --card: #FFFDF3;
  --pink: #FCDCE6;
  --pink2: #F7C0D0;
  --yel: #FBE48F;
  --ink: #5A0F1E;
  --mut: #8A4A5C;
  --nav: #5A0F1E;
  --line: rgba(90,15,30,.12);
  --sh: 0 10px 28px rgba(90,15,30,.10);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --bg: #2A0813;
    --card: #4A1428;
    --ink: #FFE9EE;
    --mut: #E6B9C6;
    --nav: #1F050D;
    --line: rgba(255,233,238,.14);
    --sh: 0 10px 28px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2A0813;
  --card: #4A1428;
  --ink: #FFE9EE;
  --mut: #E6B9C6;
  --nav: #1F050D;
  --line: rgba(255,233,238,.14);
  --sh: 0 10px 28px rgba(0,0,0,.35);
  color-scheme: dark;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html {
  scroll-padding-top: env(safe-area-inset-top,0px);
}
body {
  margin: 0;
  color: var(--ink);
  font: 500 16px/1.35 "Bricolage Grotesque",system-ui,sans-serif;
}
#app {
  max-width: 430px;
  margin: 0 auto;
  padding: 18px 18px 130px;
  min-height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0,1fr);
  gap: 14px;
  align-content: start;
}
button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
  padding: 0;
  transition: transform .12s;
}
button:active {
  transform: scale(.96);
}
input,
textarea {
  font: inherit;
  color: inherit;
}
h1 {
  font-size: 34px;
  line-height: 1.02;
  font-weight: 800;
  margin: 0;
  letter-spacing: -.02em;
}
h2 {
  font-size: 20px;
  margin: 6px 4px 0;
  font-weight: 800;
}
em {
  font-family: "Instrument Serif",Georgia,serif;
  font-style: italic;
  font-weight: 400;
  font-size: 1.14em;
  letter-spacing: 0;
}
.mut {
  color: var(--mut);
  font-size: 14px;
}
.row {
  display: flex;
  gap: 12px;
  align-items: center;
}
.sp {
  justify-content: space-between;
}
.g2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.col {
  display: grid;
  gap: 12px;
}
.c {
  padding: 18px;
  position: relative;
  border: 1px solid var(--line);
  isolation: isolate;
  display: grid;
  gap: 12px;
  align-content: start;
}
.pk,
.pk2,
.yl {
  color: #5A0F1E;
  border: 0;
}
.br {
  color: #FFE9EE;
  border: 0;
}
.pk .mut,
.pk2 .mut,
.yl .mut {
  color: #8A2A38;
}
.br .mut {
  color: #EBC3CF;
}
.big {
  font-size: 60px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -.03em;
}
.big small {
  font-size: 22px;
  font-weight: 600;
  opacity: .6;
  letter-spacing: 0;
}
.pill {
  height: 48px;
  padding: 0 22px;
  border-radius: 999px;
  color: #FFE9EE;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.pill.lt {
  color: #5A0F1E;
}
.pill.pp {
  color: #5A0F1E;
}
.pill.ln {
  border: 1.5px solid currentColor;
}
.rb {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  color: #FFE9EE;
  display: grid;
  place-items: center;
  flex: none;
  font-size: 24px;
  font-weight: 700;
}
.rb.lt {
  color: var(--ink);
  border: 1px solid var(--line);
}
.av {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  flex: none;
}
.fl {
  position: relative;
  display: grid;
  place-items: center;
  flex: none;
}
.fl i {
  position: absolute;
  display: grid;
  color: #5A0F1E;
}
.chips {
  display: flex;
  gap: 8px;
}
.dc {
  height: 66px;
  border-radius: 22px;
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  align-content: center;
  gap: 2px;
  font-size: 12px;
  color: var(--mut);
}
.dc b {
  font-size: 18px;
  color: var(--ink);
}
.dc.on {
  border-color: transparent;
}
.dc.on,
.dc.on b {
  color: #FFE9EE;
}
.drops {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.tg {
  display: flex;
  gap: 2px;
  border-radius: 999px;
  padding: 3px;
}
.tg button {
  flex: 1;
  height: 38px;
  border-radius: 999px;
  font-weight: 700;
  color: #5A0F1E;
}
.tg button.on {
  color: #FFE9EE;
}
.stack::before,
.stack::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 32px;
  z-index: -1;
}
.stack::before {
  background: var(--pink);
  transform: rotate(-4deg) translateY(10px);
}
.stack::after {
  background: var(--yel);
  transform: rotate(3deg) translateY(16px);
}
.nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom,0px));
  width: min(398px,calc(100% - 28px));
  height: 68px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 8px;
  z-index: 5;
}
.nav button {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  position: relative;
}
.nav button.on::after {
  content: "";
  position: absolute;
  bottom: 2px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--yel);
}
.nav .plus {
  width: 56px;
  height: 56px;
}
.it {
  display: flex;
  gap: 12px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 10px;
}
.th {
  width: 60px;
  height: 60px;
  border-radius: 18px;
  background: var(--pink);
  display: grid;
  place-items: center;
  color: #5A0F1E;
  flex: none;
  overflow: hidden;
}
.th img,
.ph {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.ph {
  border-radius: 22px;
  max-height: 300px;
}
textarea,
.inp {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 14px 16px;
  resize: none;
  outline: none;
}
textarea:focus,
.inp:focus {
  border-color: var(--ink);
}
.bp {
  height: 110px;
  display: flex;
  align-items: flex-end;
  gap: 3px;
}
.bp i {
  width: 11px;
  border-radius: 6px 6px 3px 3px;
  background: var(--pink2);
}
.bp i+i {
  background: var(--yel);
}
.bc {
  flex: 1;
  display: grid;
  justify-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--mut);
  padding: 4px 0;
  border-radius: 14px;
}
.bc.hl {
  background: repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 8px);
}
.sh {
  position: fixed;
  inset: 0;
  z-index: 9;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sh>div {
  width: 100%;
  max-width: 430px;
  border-radius: 32px 32px 0 0;
  padding: 22px 18px calc(22px + env(safe-area-inset-bottom,0px));
  max-height: 92dvh;
  overflow: auto;
  display: grid;
  gap: 14px;
  animation: up .25s ease;
}
@keyframes up {
  from {
    transform: translateY(40px);
    opacity: 0;
  }
}
.toast {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top,0px));
  left: 50%;
  transform: translateX(-50%);
  color: #FFE9EE;
  padding: 12px 20px;
  border-radius: 999px;
  z-index: 20;
  font-weight: 700;
  box-shadow: 0 8px 24px rgba(0,0,0,.3);
  max-width: 92%;
  text-align: center;
}
.ban {
  color: #FFE9EE;
  border-radius: 28px;
  padding: 16px;
  display: grid;
  gap: 12px;
  animation: up .3s ease;
}
.ban .pill {
  height: 40px;
  font-size: 14px;
  padding: 0 16px;
  background: rgba(255,255,255,.16);
}
.mood {
  border-radius: 36px;
  padding: 22px;
  min-height: 196px;
  display: grid;
  align-content: space-between;
  text-align: left;
  color: #5A0F1E;
  overflow: hidden;
  position: relative;
}
.mood b {
  font-size: 40px;
  font-weight: 800;
  letter-spacing: -.02em;
  line-height: 1;
}
.sw {
  width: 54px;
  height: 32px;
  border-radius: 16px;
  position: relative;
  flex: none;
}
.sw::after {
  content: "";
  position: absolute;
  top: 4px;
  left: 4px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #fff;
  transition: left .15s;
}
.sw.on {
  background: var(--nav);
}
.sw.on::after {
  left: 26px;
}
.q {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.q button {
  border-radius: 28px;
  padding: 18px;
  display: grid;
  gap: 8px;
  text-align: left;
  font-weight: 800;
  font-size: 18px;
  color: #5A0F1E;
}
label.pill input {
  display: none;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(circle at 8% -4%,rgba(249,201,215,.75),transparent 42%),radial-gradient(circle at 104% 18%,rgba(251,228,143,.6),transparent 38%),radial-gradient(circle at 0% 100%,rgba(242,167,189,.35),transparent 40%);
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) body::before {
    opacity: .18;
  }
}
:root[data-theme="dark"] body::before {
  opacity: .18;
}
.c {
  box-shadow: var(--sh),inset 0 1px 0 rgba(255,255,255,.45);
  border-radius: 34px;
}
.pk {
  background: linear-gradient(155deg,#FEE8EF,#FBD0DD);
}
.pk2 {
  background: linear-gradient(155deg,#FBD5E0,#F6B9CA);
}
.yl {
  background: linear-gradient(155deg,#FDEDAA,#F9DA79);
}
.br {
  background: linear-gradient(160deg,#8A1C30,#4A0813);
}
.pill {
  box-shadow: 0 6px 14px rgba(90,15,30,.16);
}
.pill.ln,
.pill.lt {
  box-shadow: none;
}
h1 em {
  color: #E27A9B;
}
.fl svg {
  animation: spin 50s linear infinite;
}
.mood {
  transition: transform .25s;
}
.mood:active {
  transform: scale(.97) rotate(-1deg);
}
.sentwrap {
  min-height: 60dvh;
  display: grid;
  align-content: center;
  justify-items: center;
  gap: 14px;
  text-align: center;
}
.sentwrap .fl {
  animation: pop .8s both;
}
#app.enter {
  animation: fade .35s ease;
}
.cup {
  overflow: visible;
  flex: none;
}
.cup .lid {
  transform-box: fill-box;
  transform-origin: left bottom;
}
.cup .st {
  opacity: .45;
}
.cup.go {
  animation: wob 1.4s ease;
}
.cup.go .lid {
  animation: lid 1.4s cubic-bezier(.3,1.4,.5,1);
}
.cup.go .st {
  animation: steam 1.4s ease both;
}
.cup.go .s2 {
  animation-delay: .12s;
}
.cup.go .s3 {
  animation-delay: .24s;
}
.drops svg {
  transform-box: fill-box;
  transform-origin: center;
  transition: fill .2s;
}
.drops .pop {
  animation: pop .5s;
}
.rxs {
  display: flex;
  gap: 8px;
}
.rx {
  flex: 1;
  height: 48px;
  border-radius: 999px;
  font-size: 22px;
  transition: transform .15s,background .2s;
}
.rx.on {
  background: var(--nav);
  animation: pop .5s;
}
.rxn {
  background: var(--yel);
  border: 0;
  color: #5A0F1E;
  animation: up .35s ease;
}
.rxn .mut {
  color: #8A2A38;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes fade {
  from {
    opacity: 0;
  }
}
@keyframes pop {
  35% {
    transform: scale(1.4) rotate(-8deg);
  }
  70% {
    transform: scale(.92);
  }
}
@keyframes lid {
  0%,
  100% {
    transform: none;
  }
  22%,
  72% {
    transform: translate(-7px,-13px) rotate(-26deg);
  }
}
@keyframes steam {
  0% {
    opacity: 0;
    transform: translateY(5px);
  }
  30%,
  68% {
    opacity: .85;
    transform: translateY(-2px);
  }
  100% {
    opacity: 0;
    transform: translateY(-7px);
  }
}
@keyframes wob {
  0%,
  100% {
    transform: none;
  }
  15% {
    transform: rotate(-6deg);
  }
  30% {
    transform: rotate(5deg);
  }
  45% {
    transform: none;
  }
}
.chips {
  position: relative;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px 0;
}
.dc {
  flex: 0 0 54px;
}
.gl .wv {
  transition: y .3s;
}
.gl.go .wv {
  animation: fillup .9s ease both;
}
.gl.go {
  animation: wob 1s ease;
}
.pt {
  position: fixed;
  z-index: 30;
  pointer-events: none;
  font-size: 22px;
  opacity: 0;
  animation: pt 1.1s ease-out both;
}
.bub {
  max-width: 86%;
  padding: 10px 14px;
  border-radius: 20px;
  font-weight: 600;
  display: grid;
  gap: 2px;
  animation: up .3s ease;
}
.bub.me {
  background: var(--nav);
  color: #FFE9EE;
  justify-self: end;
  border-bottom-right-radius: 6px;
}
.bub.th {
  color: #5A0F1E;
  justify-self: start;
  border-bottom-left-radius: 6px;
}
.bub .m {
  font-size: 11px;
  opacity: .65;
  font-weight: 500;
}
.chps {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
}
.chp {
  height: 34px;
  padding: 0 14px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 700;
  color: #5A0F1E;
  white-space: nowrap;
  flex: none;
}
.rrow {
  display: flex;
  gap: 8px;
  align-items: center;
}
.rin {
  flex: 1;
  width: auto;
  min-width: 0;
  height: 46px;
  border-radius: 999px;
  padding: 0 16px;
  color: #5A0F1E;
  border: 0;
}
.rin::placeholder {
  color: #8A4A5C;
}
@keyframes fillup {
  from {
    transform: translateY(16px);
  }
}
@keyframes pt {
  0% {
    opacity: 1;
    transform: translate(0,0) scale(.5);
  }
  100% {
    opacity: 0;
    transform: translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--r));
  }
}
.fb {
  transform-box: fill-box;
  transform-origin: center;
}
.scn {
  left: 50%;
  top: 46%;
  width: 250px;
  border-radius: 38px;
  background: #FFF8DC;
  pointer-events: none;
  animation: scn 2.6s ease both;
  text-align: center;
}
.scn svg {
  display: block;
}
.scp {
  font: 800 18px "Bricolage Grotesque",sans-serif;
  margin-top: 4px;
}
@keyframes pull {
  from {
    transform: translate(60px,34px) rotate(10deg);
  }
}
@keyframes off {
  to {
    transform: translate(90px,-34px) rotate(-30deg);
    opacity: 0;
  }
}
@keyframes draw {
  to {
    stroke-dashoffset: 0;
  }
}
@keyframes hide {
  to {
    opacity: 0;
  }
}
@keyframes show {
  from {
    opacity: 0;
  }
}
@keyframes zz {
  0% {
    opacity: 0;
    transform: translate(0,8px);
  }
  30% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translate(16px,-24px);
  }
}
@keyframes yawn {
  0%,
  100% {
    transform: scaleY(1);
  }
  40%,
  70% {
    transform: scale(1.6,6);
  }
}
@keyframes pin {
  from {
    opacity: 0;
    transform: scale(.3);
  }
}
@keyframes rse {
  from {
    transform: translateY(34px);
    opacity: 0;
  }
}
@keyframes swing {
  0%,
  100% {
    transform: rotate(0);
  }
  20% {
    transform: rotate(22deg);
  }
  40% {
    transform: rotate(-20deg);
  }
  60% {
    transform: rotate(14deg);
  }
  80% {
    transform: rotate(-8deg);
  }
}
@keyframes fall {
  from {
    transform: translateY(-4px);
    opacity: 0;
  }
  30% {
    opacity: 1;
  }
  to {
    transform: translateY(50px);
    opacity: 0;
  }
}
@keyframes lift {
  to {
    transform: translate(0,-40px) rotate(-14deg);
  }
}
@keyframes wf {
  from {
    transform: translateY(80px);
  }
}
@keyframes flash {
  from {
    opacity: .9;
    transform: scale(.2);
  }
  to {
    opacity: 0;
    transform: scale(2.6);
  }
}
@keyframes bt {
  0%,
  100% {
    transform: scale(1);
  }
  30% {
    transform: scale(1.3);
  }
  60% {
    transform: scale(.95);
  }
}
.scn {
  position: absolute;
  padding: 0;
  border: 0;
  color: #5A0F1E;
  overflow: hidden;
  z-index: 8;
  box-shadow: 0 14px 34px rgba(42,6,18,.3);
}
.scn svg {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: calc(100% - 30px);
  overflow: visible;
}
.scp {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 8px;
  margin: 0;
}
@keyframes scn {
  0% {
    opacity: 0;
    transform: scale(.95);
  }
  8%,
  88% {
    opacity: 1;
    transform: none;
  }
  100% {
    opacity: 0;
  }
}
@keyframes arm {
  from {
    transform: translateY(8px);
  }
  to {
    transform: translate(12px,-38px) rotate(-25deg);
  }
}
@keyframes wob2 {
  from {
    transform: rotate(-4deg);
  }
  to {
    transform: rotate(4deg);
  }
}
@keyframes stk {
  0% {
    opacity: 0;
    transform: translateY(14px);
  }
  40% {
    opacity: .9;
  }
  100% {
    opacity: 0;
    transform: translateY(-16px);

.bookwrap { position: relative; }

const cup=(p)=>`<svg class="cup${tmp.fx=='cof'?' go':''}" width="132" height="165" viewBox="11 -7 48 60" fill="none" stroke="#5A0F1E" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="st" d="M24 15c-4-4 4-7 0-12c-3-3 3-5 0-9"/><path class="st s2" d="M32 15c-4-4 4-7 0-12c-3-3 3-5 0-9"/><path class="st s3" d="M40 15c-4-4 4-7 0-12c-3-3 3-5 0-9"/><path d="M14 28h34v10a14 14 0 0 1-14 14h-6a14 14 0 0 1-14-14z" fill="#FFF8DC"/><path d="M48 31h4a6 6 0 0 1 0 12h-5"/><ellipse cx="31" cy="29" rx="15" ry="2.6" fill="#8A5636" stroke="none"/><g class="lid"><path d="M12 28h38v-4a4 4 0 0 0-4-4H16a4 4 0 0 0-4 4z" fill="#F7C0D0"/><path d="M28 20v-3h6v3"/></g></svg>`;
const toast=m=>{tmp.toast=m;clearTimeout(tmp.tt);tmp.tt=setTimeout(()=>{tmp.toast='';r()},2000)};
const head=(t,s='')=>`<div class="row"><button class="rb lt" data-a="go:today" aria-label="Back">${ic('back')}</button><div><h1>${t}</h1>${s?`<div class="mut">${s}</div>`:''}</div></div>`;
const thumb=(img,n='cam')=>`<span class="th">${img?im(img,'','',1):ic(n,24)}</span>`;
const RX=['❤️','😋','🔥','👏','😂'],MX=['🤗','❤️','🫶','☕','🌈'];
const rxr=(a,k,cur)=>`<div class="rxs sm">${RX.map(e=>`<button class="rx${cur==e?' on':''}" data-a="${a}:${k}|${e}" aria-label="React ${e}">${e}</button>`).join('')}</div>`;
const score=p=>{const a=S.asks.filter(x=>x.to==p);return{k:a.reduce((s,x)=>s+x.d,0),m:a.reduce((s,x)=>s+x.m,0)}};

function today(){const me=S.me,ot=oth(),l=L(),o=L(ot),open=S.asks.filter(a=>a.to==me&&a.state=='open').length,h=hrs(l),
chips=Object.keys(S.logs).sort().map(k=>{const d=new Date(k+'T00:00:00');return`<button class="dc${k==S.day?' on':''}" data-a="day:${k}"><span>${'SMTWTFS'[d.getDay()]}</span><b>${d.getDate()}</b></button>`}).join('');
return`<div class="row sp"><div><h1>Hi, <em>${N[me]}</em></h1><div class="mut">${new Date(S.day+'T00:00:00').toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'})}</div></div><button data-a="who" aria-label="Switch to ${N[ot]}’s phone">${av(ot)}</button></div>
<div class="chips">${chips}</div>
<div class="it" style="padding:12px 16px">${av(ot,36)}<div><b>${N[ot]} so far</b><div class="mut">${o.water} glasses · ${o.coffee.length} cups${o.mc?' · McDonald’s':''}</div></div></div>
<div class="g2"><div class="live" data-sec="water">${gl()}<span class="mut">Water</span><div class="row"><button class="rb lt" data-a="w:-1" aria-label="Remove a glass">−</button><b class="cv">${l.water}<small> / 8</small></b><button class="rb pp" data-a="w:1" aria-label="Add a glass">+</button></div></div>
<div class="live" data-sec="coffee">${cup()}<span class="mut">${l.coffee.length?'last at '+l.coffee[l.coffee.length-1].t:'Coffee'}</span><div class="row"><button class="rb lt" data-a="cofm" aria-label="Remove a cup">−</button><b class="cv">${l.coffee.length}</b><button class="rb pp" data-a="cof" aria-label="Add a cup">+</button></div></div></div>
<div class="g2"><div class="live">${bun()}<span class="mut">McDonald’s?</span>${tg('mc',l.mc)}</div><div class="live">${shw()}<span class="mut">Showered?</span>${tg('sh',l.shower)}</div></div>
<button class="c br" data-a="go:sleep" style="text-align:left"><div class="row sp"><span class="mut">Sleep</span>${ic('moon')}</div><div class="big" style="font-size:44px">${fh(h)}</div><span class="mut">${l.bed&&l.wake?`${l.bed} → ${l.wake}`:'tap to log bed and wake time'}</span></button>
<button class="c pk2" data-a="go:eat" style="text-align:left"><div class="row sp"><b style="font-size:22px">Meals</b>${ic('fork')}</div><div class="row">${l.meals.slice(-3).map(m=>thumb(m.img,'fork')).join('')||'<span class="mut">Nothing yet</span>'}</div><span class="mut">${l.meals.length} today${l.meals.some(m=>m.rx)?` · ${N[ot]} reacted ${l.meals.filter(m=>m.rx).map(m=>m.rx).join('')}`:''}${o.meals.length?` · ${N[ot]} added ${o.meals.length}`:''} · tap to open</span></button>
<button class="c yl" data-a="go:gal" style="text-align:left"><div class="row sp"><b style="font-size:22px">Our photos</b>${ic('grid')}</div><div class="row">${S.gallery.slice(0,3).map(g=>thumb(g.img,'grid')).join('')||'<span class="mut">Nothing yet</span>'}</div><span class="mut">${S.gallery.length?`${S.gallery.length} in the grid · latest from ${N[S.gallery[0].by]}`:'Add the first one'} · tap to open</span></button>
<button class="c" data-sec="wrap" data-a="go:wrap" style="text-align:left"><div class="row sp"><b style="font-size:22px">What did you watch?</b><span class="${tmp.fx=='saved'?'bkgo':''}">${ic('book')}</span></div><span class="mut">${l.watched?esc(l.watched):'Tap to tell the story'}</span></button>`}

function eat(){const l=L(),ot=oth(),o=L(ot);return`${head('What did you <em>eat</em>?')}
<div class="c">${tmp.mp?`<img class="ph" src="${tmp.mp}" alt="Your meal">`:''}<textarea rows="3" data-i="mt" placeholder="Describe it, like dosa and sambar">${tmp.mt}</textarea><div class="row"><label class="pill lt">${ic('cam',20)}Photo<input type="file" accept="image/*" data-f="meal"></label><button class="pill" style="flex:1" data-a="meal">Add meal</button></div></div>
<h2>Your meals</h2>${l.meals.length?l.meals.slice().reverse().map((m,i)=>`<div class="it${i==0&&tmp.fx=='meal'?' pp':''}">${thumb(m.img,'fork')}<div><div class="mut">${m.t}</div><b>${m.x||'Photo meal'}</b></div>${m.rx?`<span class="rbadge" aria-label="${N[oth()]} reacted">${m.rx}</span>`:''}</div>`).join(''):'<div class="mut" style="margin:0 4px">Nothing yet.</div>'}
<h2>${N[ot]}’s meals</h2>${o.meals.length?`<div class="c pk2"><div class="col" style="gap:8px">${o.meals.map((m,i)=>`<div class="mi"><div class="row">${thumb(m.img,'fork')}<div><div class="mut">${m.t}</div><b>${m.x||'Photo meal'}</b></div></div>${rxr('mealrx',i,m.rx)}</div>`).join('')}</div></div>`:`<div class="mut" style="margin:0 4px">${N[ot]} hasn’t added anything yet.</div>`}`}

function sleep(){const l=L(),r=days.map(d=>hrs(L(S.me,D(d))));return`${head('Sleep','last night and the week')}
<div class="sl2"><div class="live"><div class="zsc zbed">${SC.sleep}</div><span class="mut">Went to bed</span><input class="inp tm" type="time" data-i="bed" value="${l.bed}"></div><div class="live"><div class="zsc zwake">${SC.wake}</div><span class="mut">Woke up</span><input class="inp tm" type="time" data-i="wake" value="${l.wake}"></div></div>
<div class="live"><span class="mut">You slept</span><div class="big" id="dur">${fh(hrs(l))}</div></div>
<button class="pill" data-a="saved">Save sleep</button>`}

function wrap(){const l=L();return`${head('What did you <em>watch</em>?')}
<div class="c yl"><div class="row">${fl('#FFF8DC',44,'book')}<b>Tonight’s watch</b></div><input class="inp wi" data-i="watched" placeholder="A show, a movie, anything…" value="${esc(l.watched)}"></div><button class="pill" data-a="saved">Save it</button>`}

/* ---------- Requests, reminders and proof ---------- */
function asks(){const me=S.me,ot=oth(),mine=S.asks.filter(a=>a.to==me),theirs=S.asks.filter(a=>a.from==me),sc=p=>{const s=score(p);return`<div class="c ${p=='a'?'pk':'yl'}"><div class="row">${av(p,34)}<b>${N[p]}</b></div><div style="font-size:22px;font-weight:800">${s.k} kept · ${s.m} missed</div></div>`};
return`<div class="row sp"><h1>Asks <em>&amp; proof</em></h1><button data-a="who" aria-label="Switch phone">${av(ot)}</button></div>
<h2>From ${N[ot]}</h2>${mine.map(a=>`<div class="c" data-sec="a${a.id}"><div class="row sp"><b>${a.text}</b><span class="mut">${a.daily?'daily':'by '+a.time}</span></div>${a.state=='open'?`<div class="row"><button class="pill" style="flex:1" data-a="${a.photo?'snap':'done'}:${a.id}">${a.photo?ic('cam',20)+'Snap proof':'Done'}</button><button class="pill ln" data-a="miss:${a.id}">Not today</button></div>`:a.state=='done'?`<div class="row">${thumb(a.proof)}<span class="mut">Done · ${a.at}${a.ok?' · approved':''}</span>${a.rx?`<span class="rbadge">${a.rx}</span>`:''}</div>`:'<span class="mut">Marked not today</span>'}</div>`).join('')||'<div class="mut">Nothing from them.</div>'}
<h2>You asked ${N[ot]}</h2>${theirs.map(a=>`<div class="c" data-sec="a${a.id}"><div class="row sp"><b>${a.text}</b>${a.m?`<span class="mut">missed ${a.m}×</span>`:''}</div>${a.state=='open'?`<div class="row sp"><span class="mut">Not done yet</span><button class="pill pp" data-a="nudge:${a.id}">Nudge</button></div>`:a.state=='done'?`${a.proof?`${im(a.proof,'ph','Proof from '+N[ot])}${keepBtn(a.proof)}`:''}<div class="row">${a.proof?'':thumb(null)}<div style="flex:1"><div class="mut">${a.proof?'Photo':'Done'} · ${a.at}</div></div></div>${rxr('photorx',a.id,a.rx)}${a.ok?'<span class="mut">You approved this one</span>':`<div class="row"><button class="pill" style="flex:1" data-a="ok:${a.id}">Looks good</button><button class="pill ln" data-a="no:${a.id}">Not quite</button></div>`}`:'<span class="mut">Marked not today</span>'}</div>`).join('')}
<button class="pill pp" data-a="sheet:ask" style="height:56px">${ic('plus',20)}New ask</button>`}

function ping(){return`<div><h1>How are <em>you</em>?</h1><div class="mut">right now, this very minute</div></div>
<button class="mood" style="background:var(--yel)" data-a="ping:bored"><span style="position:absolute;right:-18px;top:-18px">${fl('#FFF8DC',110)}</span><span style="position:relative">${ic('cloud',44)}</span><b>Bored</b><span class="mut" style="color:#8A2A38">Tell ${N[oth()]} I’d love company</span></button>
<button class="mood" style="background:var(--pink2)" data-a="ping:upset"><span style="position:absolute;right:-18px;top:-18px">${fl('#FCDCE6',110)}</span><span style="position:relative">${ic('rain',44)}</span><b>Upset</b><span class="mut" style="color:#8A2A38">Tell ${N[oth()]} I could use a hand</span></button>
<div class="it" style="padding:12px 16px">${fl('#FBE48F',34)}<span class="mut">Goes straight to ${N[oth()]}’s phone. Never saved, never counted.</span></div>`}

function sent(){const s=tmp.sent;return`<div class="sentwrap"><div style="width:230px">${SC[s.k]}</div><h1 style="font-size:46px">${N[s.to]} <em>knows</em>.</h1><div class="mut">${N[s.to]} will see it on their own phone.</div><button class="pill" data-a="go:ping">Done</button><div class="mut">Not saved anywhere.</div></div>`}

/* ---------- Weekly summaries and photo views ---------- */
function week(){const days=wdays(),R=p=>days.map(d=>L(p,D(d))),sc=p=>{const s=score(p),t=s.k+s.m;return`<div class="c ${p=='a'?'pk':'yl'}"><b>${N[p]}</b><div><div style="font-size:30px;font-weight:800;line-height:1">${t?Math.round(s.k/t*100):0}%</div><div class="mut">follow-through</div></div><div class="mut">${s.k} kept · ${s.m} missed<br>${R(p).filter(logged).length} of 7 days logged</div></div>`},
tm=m=>{m=Math.round(m)%1440;const h=Math.floor(m/60);return`${(h+11)%12+1}:${String(m%60).padStart(2,'0')} ${h<12?'am':'pm'}`},
mins=(l,k)=>{const[h,m]=l[k].split(':').map(Number),x=h*60+m;return k=='bed'&&x<720?x+1440:x},
mean=(p,k)=>{const v=R(p).filter(l=>l[k]).map(l=>mins(l,k));return v.length?tm(v.reduce((a,b)=>a+b)/v.length):'—'},
sh=h=>h==null?3:Math.min(h,10)*11,hl=h=>h==null?'–':Math.round(h*10)/10,
avg=p=>{const v=R(p).map(hrs).filter(x=>x!=null);return v.length?fh(v.reduce((a,b)=>a+b)/v.length):'—'},dots=(p,c)=>`<div class="row sp"><b>${N[p]}</b><div class="row" style="gap:8px">${R(p).map(l=>`<span style="width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);background:${l.mc?c:'transparent'}"></span>`).join('')}</div></div>`,
w=[...new Set([].concat(...['a','b'].map(p=>R(p).filter(l=>l.watched).map(l=>`${N[p]} · ${l.watched}`))))];
return`<div><h1>Our <em>week</em></h1><div class="mut">${days[0].toLocaleDateString([],{month:'short',day:'numeric'})} – ${days[6].toLocaleDateString([],{month:'short',day:'numeric'})} · counted, not guessed</div></div><div class="row sp"><button class="pill lt" style="border:1px solid var(--line)" data-a="wk:1">‹ Earlier</button><span class="mut">${tmp.wk?tmp.wk+' week'+(tmp.wk>1?'s':'')+' ago':'This week'}</span><button class="pill lt" style="border:1px solid var(--line);${tmp.wk?'':'opacity:.4'}" data-a="wk:-1">Later ›</button></div>
<h2>Keeping each other honest</h2><div class="g2">${sc('a')}${sc('b')}</div>
<div class="c"><b>Water, glasses a day</b><div class="row" style="align-items:flex-end">${days.map((d,i)=>`<div class="bc${i==6?' hl':''}"><div class="bp"><i style="height:${Math.min(R('a')[i].water,10)*11}px"></i><i style="height:${Math.min(R('b')[i].water,10)*11}px"></i></div>${'SMTWTFS'[d.getDay()]}</div>`).join('')}</div><div class="row mut"><span style="width:12px;height:12px;border-radius:4px;background:var(--pink2)"></span>${N.a}<span style="width:12px;height:12px;border-radius:4px;background:var(--yel)"></span>${N.b}</div></div>
<div class="c"><b>Sleep, hours a night</b><div class="row" style="align-items:flex-end">${days.map((d,i)=>{const ha=hrs(R('a')[i]),hb=hrs(R('b')[i]);return`<div class="bc${i==6?' hl':''}"><div class="bp"><i style="height:${sh(ha)}px"></i><i style="height:${sh(hb)}px"></i></div>${'SMTWTFS'[d.getDay()]}<span style="display:flex;gap:3px;font-size:10px;line-height:1.2"><span style="border-bottom:2px solid var(--pink2)">${hl(ha)}</span><span style="border-bottom:2px solid var(--yel)">${hl(hb)}</span></span></div>`}).join('')}</div>
<div style="display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:8px 6px;font-size:13.5px;align-items:center;border-top:1px solid var(--line);padding-top:12px;white-space:nowrap"><span></span><span class="mut">Avg sleep</span><span class="mut">Avg bed</span><span class="mut">Avg wake</span>${['a','b'].map(p=>`<span class="row" style="gap:6px"><span style="width:12px;height:12px;border-radius:4px;background:${p=='a'?'var(--pink2)':'var(--yel)'}"></span><b>${N[p]}</b></span><b>${avg(p)}</b><b>${mean(p,'bed')}</b><b>${mean(p,'wake')}</b>`).join('')}</div></div>
<div class="c"><b>McDonald’s days</b>${dots('a','var(--pink2)')}${dots('b','var(--yel)')}</div>
<div class="g2"><div class="c yl"><span class="mut">Coffee cups</span><b style="font-size:26px">${R('a').reduce((s,l)=>s+l.coffee.length,0)} / ${R('b').reduce((s,l)=>s+l.coffee.length,0)}</b></div><div class="c pk"><span class="mut">No shower</span><b style="font-size:26px">${R('a').filter(l=>l.shower===false).length} / ${R('b').filter(l=>l.shower===false).length}</b></div></div>
<div class="g2"><div class="c"><span class="mut">Photos sent</span><b style="font-size:26px">${S.asks.filter(a=>a.proof).length}</b></div><div class="c br"><span class="mut">In our grid</span><b style="font-size:26px">${S.gallery.length}</b></div></div>
<div class="c"><b>Watched</b>${w.map(x=>`<span>${x}</span>`).join('')||'<span class="mut">Nothing logged yet.</span>'}</div><button class="pill ln" data-a="signout" style="color:var(--mut)">Sign out</button>`}

function pics(){const g=S.gallery,n=p=>g.filter(x=>x.by==p).length,ot=oth();
return`${head('Our <em>photos</em>',g.length?`${g.length} photo${g.length>1?'s':''} · ${n('a')} from ${N.a} · ${n('b')} from ${N.b}`:'one grid, both of you')}

${g.length?`<div class="gg">${g.map((x,i)=>`<button class="gt${tmp.fx=='gal'&&i<tmp.nn?' fresh':''}" data-a="pv:${x.id}" aria-label="Photo from ${N[x.by]}">${im(x.img,'','',1)}${av(x.by,22)}</button>`).join('')}</div>`:'<div class="mut" style="text-align:center;margin:24px 0">No photos yet. Add the first one.</div>'}`}

function pair(){if(tmp.loading)return`<div class="sentwrap"><div class="mut">Loading…</div></div>`;const w=tmp.lw;
return`<div style="display:grid;gap:16px;padding-top:30px"><div class="row" style="gap:0">${fl('#FCDCE6',120,'moon')}<span style="margin-left:-22px">${fl('#FBE48F',120,'sun')}</span></div><h1 style="font-size:52px">Just <em>us two</em></h1><div class="mut" style="font-size:17px">A small app for exactly two people. Nobody else gets in.</div>
<div class="g2">${['a','b'].map(p=>`<button class="c ${p=='a'?'pk':'yl'}" style="justify-items:start;${w==p?'outline:3px solid #5A0F1E;outline-offset:2px':''}" data-a="pick:${p}">${av(p,40)}<b style="font-size:20px">${DEF[p]}</b></button>`).join('')}</div>
<input class="inp" type="password" data-i="pw" placeholder="Password" autocomplete="current-password" value="${(tmp.pw||'').replace(/"/g,'&quot;')}"><button class="pill pp" style="height:56px" data-a="signin">Sign in</button>${tmp.err?`<div class="mut" style="text-align:center">${tmp.err}</div>`:''}</div>`}

function sheets(){let h='';
if(tmp.sheet=='add')h=`<div class="sh" data-a="sheet:"><div data-stop><h2 style="margin:0">Quick add</h2><div class="q"><button style="background:var(--pink)" data-a="go:eat">${ic('fork',28)}Meal</button><button style="background:var(--yel)" data-a="qw">${ic('drop',28)}Water +1</button><button style="background:var(--pink2)" data-a="qc">${ic('cup',28)}Coffee +1</button><button style="background:var(--card);color:var(--ink)" data-a="go:sleep">${ic('moon',28)}Sleep</button><button style="background:var(--card);color:var(--ink)" data-a="go:wrap">${ic('book',28)}Wrap-up</button><button style="background:var(--yel)" data-a="sheet:ask">${ic('plus',28)}New ask</button><button style="background:var(--pink2);grid-column:1/-1" data-a="go:gal">${ic('grid',28)}Our photos</button></div></div></div>`;
