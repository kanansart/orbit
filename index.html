:root[data-who="b"]{--o1:rgba(190,45,70,.55);--o2:rgba(255,125,155,.65);--o3:rgba(230,130,50,.6);--o4:rgba(150,60,30,.5)}
body::after{content:none}
/* real glass: much more see-through pink */
:root[data-who="b"] .c.pk{background:linear-gradient(155deg,rgba(254,232,239,.44),rgba(251,208,221,.34))}
:root[data-who="b"] .c.pk2{background:linear-gradient(155deg,rgba(251,213,224,.44),rgba(246,185,202,.34))}
:root[data-who="a"] .c.pk,:root[data-who="a"] .c.pk2{background:linear-gradient(155deg,rgba(255,175,200,.28),rgba(255,130,165,.16));border:1px solid rgba(255,205,220,.3);color:var(--ink)}
:root[data-who="a"] .pk .mut,:root[data-who="a"] .pk2 .mut{color:var(--mut)}
:root[data-who="a"] .pk2 .mi .mut{color:#8A2A38}
:root[data-who="a"] .c.pk [fill="#5A0F1E"]{fill:#FFE9EE}
:root[data-who="a"] .c.pk [stroke="#5A0F1E"]{stroke:#FFE9EE}
:root[data-who="a"] .mood[style*="--pink2"],:root[data-who="a"] .q button[style*="--pink"]{background:linear-gradient(155deg,rgba(255,175,200,.28),rgba(255,130,165,.16))!important;color:var(--ink)}
:root[data-who="a"] .mood[style*="--pink2"] .mut{color:var(--mut)!important}
/* nav: nearly invisible bar, solid buttons */
.nav{background:color-mix(in srgb,var(--nav) 8%,transparent);border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.nav button{background:var(--nav);color:#FFE9EE}
.nav button.on{background:var(--yel);color:#5A0F1E}
.nav button.on::after{display:none}
.nav .plus{background:var(--pink2);color:#5A0F1E}
.c.pk{background:linear-gradient(155deg,rgba(254,232,239,.66),rgba(251,208,221,.54))}
.c.pk2{background:linear-gradient(155deg,rgba(251,213,224,.64),rgba(246,185,202,.52))}
.c.pk,.c.pk2,[style*="background:var(--pink)"],[style*="background:var(--pink2)"]{-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5)}
.nav{-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6)}
/* nav: extremely transparent */
.nav{background:color-mix(in srgb,var(--nav) 12%,transparent);border:1px solid rgba(255,255,255,.24);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.nav .plus{background:rgba(247,192,208,.4)}
:root[data-who="b"] .nav button{color:rgba(90,15,30,.6)}
:root[data-who="b"] .nav button.on{color:#5A0F1E}
:root[data-who="b"] .nav button.on::after{background:#5A0F1E}
/* everything non-pink is solid */
.pill{background:var(--nav)}.pill.lt{background:#FFF3F6}
.rb{background:var(--nav)}.rb.lt{background:var(--card)}
.tg{background:#FFF3F6}.tg button.on{background:#5A0F1E}
.rxs.sm .rx{background:color-mix(in srgb,var(--ink) 14%,var(--card))}
.ban .rxs .rx{background:color-mix(in srgb,#fff 16%,var(--nav))}
.sw{background:color-mix(in srgb,var(--ink) 22%,var(--card))}
.bub.th{background:#FFF3F6}.chp{background:#FFF3F6}
textarea,.inp{background:var(--card)}.rin{background:#FFF3F6}
.nav{background:var(--nav);-webkit-backdrop-filter:none;backdrop-filter:none}
.toast{background:var(--nav);-webkit-backdrop-filter:none;backdrop-filter:none}
.sh{background:rgba(20,0,0,.5);-webkit-backdrop-filter:none;backdrop-filter:none}
.sh>div{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
/* bg gradients: each theme gets a touch of the other's color */
:root[data-who="a"] body{background:radial-gradient(120% 55% at 100% 0%,rgba(251,200,70,.30),transparent 62%),radial-gradient(100% 50% at 0% 100%,rgba(170,70,15,.38),transparent 62%),linear-gradient(165deg,#380000 0%,#42100a 55%,#52200c 100%) fixed}
:root[data-who="b"] body{background:radial-gradient(110% 55% at 0% 100%,rgba(150,40,40,.30),transparent 62%),radial-gradient(90% 45% at 100% 0%,rgba(225,140,60,.28),transparent 62%),linear-gradient(165deg,#FBE48F 0%,#FFF3C4 100%) fixed}
/* nav (final say): see-through bar, no blur so things passing under stay visible, solid buttons */
.nav{background:color-mix(in srgb,var(--nav) 4%,transparent);-webkit-backdrop-filter:none;backdrop-filter:none;border:1px solid rgba(255,255,255,.22);box-shadow:none}
/* upset: slow, droopy, sad */
@keyframes droop{from{transform:translateY(-2px) rotate(.6deg)}to{transform:translateY(8px) rotate(-1.5deg)}}
@keyframes sinkdrip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(6px);opacity:.7}}
.mood[data-a="ping:upset"]{animation:droop 4.2s ease-in-out infinite alternate}
.mood[data-a="ping:upset"]>span:nth-child(2) svg{animation:sinkdrip 2.4s ease-in infinite}
/* card animations that play before the pop-up scene */
.fxc{animation:wob 1s ease}
.it.pp{animation:pop .8s}
.bkgo{display:inline-grid;animation:bt .9s 2}
.ig{animation:swing 1.2s ease;transform-origin:50% 0}
.ig2{animation:spin 1.2s ease}
/* time inputs: readable on both themes (they inherited dark text from the label) */
input[type=time].inp{color:var(--ink);-webkit-text-fill-color:var(--ink);font-weight:700;font-size:20px}
input[type=time].inp::-webkit-datetime-edit,input[type=time].inp::-webkit-datetime-edit-hour-field,input[type=time].inp::-webkit-datetime-edit-minute-field,input[type=time].inp::-webkit-datetime-edit-text{color:var(--ink)}
.nav button{background:var(--nav);color:#FFE9EE}
.nav button.on{background:var(--yel);color:#5A0F1E}
.nav button.on::after{display:none}
.nav .plus{background:var(--pink2);color:#5A0F1E}
:root[data-who="b"] .nav button{color:#FFE9EE}
:root[data-who="b"] .nav button.on{color:#5A0F1E}
/* colored cards stay solid */
.c.pk,.c.pk2,.c.yl,.c.br{-webkit-backdrop-filter:none;backdrop-filter:none}
.c.pk{background:linear-gradient(155deg,#FEE8EF,#FBD0DD)}
.c.pk2{background:linear-gradient(155deg,#FBD5E0,#F6B9CA)}
.c.yl{background:linear-gradient(155deg,#FDEDAA,#F9DA79)}
.c.br{background:linear-gradient(160deg,#8A1C30,#4A0813)}
[style*="background:var(--yel)"]{background:var(--yel)!important;-webkit-backdrop-filter:none;backdrop-filter:none}
[style*="background:var(--pink)"]{background:var(--pink)!important;-webkit-backdrop-filter:none;backdrop-filter:none}
[style*="background:var(--pink2)"]{background:var(--pink2)!important;-webkit-backdrop-filter:none;backdrop-filter:none}
/* shared photo grid */
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gt{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--pink);display:block;width:100%}
.gt img{width:100%;height:100%;object-fit:cover;display:block}
.gt .av{position:absolute;left:6px;bottom:6px;animation:none;box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.gt.fresh{animation:pin .45s ease both}

/* pink tiles: nearly solid (raise the .88/.82 numbers toward 1 for fully solid) */
:root[data-who="a"] .c.pk{background:linear-gradient(155deg,rgba(254,232,239,.88),rgba(251,208,221,.82));color:#5A0F1E}
:root[data-who="a"] .c.pk2{background:linear-gradient(155deg,rgba(251,213,224,.88),rgba(246,185,202,.82));color:#5A0F1E}

:root[data-who="a"] .pk .mut,:root[data-who="a"] .pk2 .mut{color:#7A2233}
:root[data-who="a"] .mood[style*="--pink2"] .mut{color:#7A2233!important}
:root[data-who="a"] .c.pk [fill="#5A0F1E"]{fill:#5A0F1E}
:root[data-who="a"] .c.pk [stroke="#5A0F1E"]{stroke:#5A0F1E}
:root[data-who="b"] .c.pk{background:linear-gradient(155deg,rgba(254,232,239,.92),rgba(251,208,221,.88))}
:root[data-who="b"] .c.pk2{background:linear-gradient(155deg,rgba(251,213,224,.92),rgba(246,185,202,.88))}
/* Mira's maroon tiles: slightly see-through (86 = % opaque; raise for more solid, lower for more glass) */

/* "asks waiting" stack card: the yellow layer sits on top of it, so use dark text */
.c.br.stack{color:#5A0F1E}
.c.br.stack .mut{color:#7A2233}

<div class="c">${tmp.mp?`<img class="ph" src="${tmp.mp}" alt="Your meal">`:''}<textarea rows="3" data-i="mt" placeholder="Describe it, like dosa and sambar">${tmp.mt}</textarea><div class="row"><label class="pill lt">${ic('cam',20)}Photo<input type="file" accept="image/*" data-f="meal"></label><button class="pill" style="flex:1" data-a="meal">Add meal</button></div></div>
<h2>Your meals</h2>${l.meals.length?l.meals.slice().reverse().map((m,i)=>`<div class="it${i==0&&tmp.fx=='meal'?' pp':''}">${thumb(m.img,'fork')}<div><div class="mut">${m.t}</div><b>${m.x||'Photo meal'}</b></div>${m.rx?`<span class="rbadge" aria-label="${N[oth()]} reacted">${m.rx}</span>`:''}</div>`).join(''):'<div class="mut" style="margin:0 4px">Nothing yet.</div>'}
<h2>${N[ot]}’s meals</h2>${o.meals.length?`<div class="c pk2"><div class="col" style="gap:8px">${o.meals.map((m,i)=>`<div class="mi"><div class="row">${thumb(m.img,'fork')}<div><div class="mut">${m.t}</div><b>${m.x||'Photo meal'}</b></div></div>${rxr('mealrx',i,m.rx)}</div>`).join('')}</div></div>`:`<div class="mut" style="margin:0 4px">${N[ot]} hasn’t added anything yet.</div>`}`}

function sleep(){const l=L(),r=days.map(d=>hrs(L(S.me,D(d))));return`${head('Sleep','last night and the week')}
<div class="g2"><label class="c" style="background:var(--yel);color:#5A0F1E;border:0"><span class="row sp mut">Went to bed${ic('moon',20)}</span><input class="inp" type="time" data-i="bed" value="${l.bed}"></label><label class="c pk" style="color:#5A0F1E;border:0"><span class="row sp mut">Woke up${ic('sun',20)}</span><input class="inp" type="time" data-i="wake" value="${l.wake}"></label></div>
<div class="c br"><span class="mut">You slept</span><div class="big" id="dur">${fh(hrs(l))}</div></div>
<div class="c"><b>Last 7 nights</b><div class="row" style="align-items:flex-end">${r.map((h,i)=>`<div class="bc${i==6?' hl':''}"><div class="bp"><i style="height:${h?h/9*110:3}px"></i></div>${'SMTWTFS'[days[i].getDay()]}</div>`).join('')}</div></div>
<button class="pill" data-a="saved">Save sleep</button>`}

function wrap(){const l=L();return`${head('Day <em>wrap-up</em>')}
<div class="c pk"><div class="row sp"><b>Did you shower?</b></div>${tg('sh',l.shower)}</div><div class="c yl"><b>McDonald’s today?</b>${tg('mc',l.mc)}</div>

function asks(){const me=S.me,ot=oth(),mine=S.asks.filter(a=>a.to==me),theirs=S.asks.filter(a=>a.from==me),sc=p=>{const s=score(p);return`<div class="c ${p=='a'?'pk':'yl'}"><div class="row">${av(p,34)}<b>${N[p]}</b></div><div style="font-size:22px;font-weight:800">${s.k} kept · ${s.m} missed</div></div>`};
return`<div class="row sp"><h1>Asks <em>&amp; proof</em></h1><button data-a="who" aria-label="Switch phone">${av(ot)}</button></div><div class="g2">${sc('a')}${sc('b')}</div>

<h2>You asked ${N[ot]}</h2>${theirs.map(a=>`<div class="c" data-sec="a${a.id}"><div class="row sp"><b>${a.text}</b>${a.m?`<span class="mut">missed ${a.m}×</span>`:''}</div>${a.state=='open'?`<div class="row sp"><span class="mut">Not done yet</span><button class="pill pp" data-a="nudge:${a.id}">Nudge</button></div>`:a.state=='done'?`${a.proof?`${im(a.proof,'ph','Proof from '+N[ot])}${keepBtn(a.proof)}`:''}<div class="row">${a.proof?'':thumb(null)}<div style="flex:1"><div class="mut">${a.proof?'Photo':'Done'} · ${a.at}</div></div></div>${rxr('photorx',a.id,a.rx)}${a.ok?'<span class="mut">You approved this one</span>':`<div class="row"><button class="pill" style="flex:1" data-a="ok:${a.id}">Looks good</button><button class="pill ln" data-a="no:${a.id}">Not quite</button></div>`}`:'<span class="mut">Marked not today</span>'}</div>`).join('')}
<button class="pill pp" data-a="sheet:ask" style="height:56px">${ic('plus',20)}New ask</button>`}

function ping(){return`<div><h1>How are <em>you</em>?</h1><div class="mut">right now, this very minute</div></div>
<button class="mood" style="background:var(--yel)" data-a="ping:bored"><span style="position:absolute;right:-18px;top:-18px">${fl('#FFF8DC',110)}</span><span style="position:relative">${ic('cloud',44)}</span><b>Bored</b><span class="mut" style="color:#8A2A38">Tell ${N[oth()]} I’d love company</span></button>
<button class="mood" style="background:var(--pink2)" data-a="ping:upset"><span style="position:absolute;right:-18px;top:-18px">${fl('#FCDCE6',110)}</span><span style="position:relative">${ic('rain',44)}</span><b>Upset</b><span class="mut" style="color:#8A2A38">Tell ${N[oth()]} I could use a hand</span></button>
<div class="it" style="padding:12px 16px">${fl('#FBE48F',34)}<span class="mut">Goes straight to ${N[oth()]}’s phone. Never saved, never counted.</span></div>`}

function sent(){const s=tmp.sent;return`<div class="sentwrap"><div style="width:230px">${SC[s.k]}</div><h1 style="font-size:46px">${N[s.to]} <em>knows</em>.</h1><div class="mut">Switch phones (top right on Today) to see what ${N[s.to]} gets.</div><button class="pill" data-a="go:ping">Done</button><div class="mut">Not saved anywhere.</div></div>`}

function week(){const days=wdays(),R=p=>days.map(d=>L(p,D(d))),sc=p=>{const s=score(p),t=s.k+s.m;return`<div class="c ${p=='a'?'pk':'yl'}"><b>${N[p]}</b><div><div style="font-size:30px;font-weight:800;line-height:1">${t?Math.round(s.k/t*100):0}%</div><div class="mut">follow-through</div></div><div class="mut">${s.k} kept · ${s.m} missed<br>${R(p).filter(logged).length} of 7 days logged</div></div>`},
tm=m=>{m=Math.round(m)%1440;const h=Math.floor(m/60);return`${(h+11)%12+1}:${String(m%60).padStart(2,'0')} ${h<12?'am':'pm'}`},
mins=(l,k)=>{const[h,m]=l[k].split(':').map(Number),x=h*60+m;return k=='bed'&&x<720?x+1440:x},
mean=(p,k)=>{const v=R(p).filter(l=>l[k]).map(l=>mins(l,k));return v.length?tm(v.reduce((a,b)=>a+b)/v.length):'—'},
sh=h=>h==null?3:Math.min(h,10)*11,hl=h=>h==null?'–':Math.round(h*10)/10,
avg=p=>{const v=R(p).map(hrs).filter(x=>x!=null);return v.length?fh(v.reduce((a,b)=>a+b)/v.length):'—'},dots=(p,c)=>`<div class="row sp"><b>${N[p]}</b><div class="row" style="gap:8px">${R(p).map(l=>`<span style="width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);background:${l.mc?c:'transparent'}"></span>`).join('')}</div></div>`,
w=[...new Set([].concat(...['a','b'].map(p=>R(p).filter(l=>l.watched).map(l=>`${N[p]} · ${l.watched}`))))];
return`<div><h1>Our <em>week</em></h1><div class="mut">${days[0].toLocaleDateString([],{month:'short',day:'numeric'})} – ${days[6].toLocaleDateString([],{month:'short',day:'numeric'})} · counted, not guessed</div></div><div class="row sp"><button class="pill lt" style="border:1px solid var(--line)" data-a="wk:1">‹ Earlier</button><span class="mut">${tmp.wk?tmp.wk+' week'+(tmp.wk>1?'s':'')+' ago':'This week'}</span><button class="pill lt" style="border:1px solid var(--line);${tmp.wk?'':'opacity:.4'}" data-a="wk:-1">Later ›</button></div>
<h2>Keeping each other honest</h2><div class="g2">${sc('a')}${sc('b')}</div>
<div class="c"><b>Water, glasses a day</b><div class="row" style="align-items:flex-end">${days.map((d,i)=>`<div class="bc${i==6?' hl':''}"><div class="bp"><i style="height:${Math.min(R('a')[i].water,10)*11}px"></i><i style="height:${Math.min(R('b')[i].water,10)*11}px"></i></div>${'SMTWTFS'[d.getDay()]}</div>`).join('')}</div><div class="row mut"><span style="width:12px;height:12px;border-radius:4px;background:var(--pink2)"></span>${N.a}<span style="width:12px;height:12px;border-radius:4px;background:var(--yel)"></span>${N.b}</div></div>
<div class="c"><b>Sleep, hours a night</b><div class="row" style="align-items:flex-end">${days.map((d,i)=>{const ha=hrs(R('a')[i]),hb=hrs(R('b')[i]);return`<div class="bc${i==6?' hl':''}"><div class="bp"><i style="height:${sh(ha)}px"></i><i style="height:${sh(hb)}px"></i></div>${'SMTWTFS'[d.getDay()]}<span style="display:flex;gap:3px;font-size:10px;line-height:1.2"><span style="border-bottom:2px solid var(--pink2)">${hl(ha)}</span><span style="border-bottom:2px solid var(--yel)">${hl(hb)}</span></span></div>`}).join('')}</div>
<div style="display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:8px 10px;align-items:center;border-top:1px solid var(--line);padding-top:12px;white-space:nowrap"><span></span><span class="mut">Avg sleep</span><span class="mut">Avg bed</span><span class="mut">Avg wake</span>${['a','b'].map(p=>`<span class="row" style="gap:6px"><span style="width:12px;height:12px;border-radius:4px;background:${p=='a'?'var(--pink2)':'var(--yel)'}"></span><b>${N[p]}</b></span><b>${avg(p)}</b><b>${mean(p,'bed')}</b><b>${mean(p,'wake')}</b>`).join('')}</div></div>
<div class="c"><b>McDonald’s days</b>${dots('a','var(--pink2)')}${dots('b','var(--yel)')}</div>
<div class="g2"><div class="c yl"><span class="mut">Coffee cups</span><b style="font-size:26px">${R('a').reduce((s,l)=>s+l.coffee.length,0)} / ${R('b').reduce((s,l)=>s+l.coffee.length,0)}</b></div><div class="c pk"><span class="mut">No shower</span><b style="font-size:26px">${R('a').filter(l=>l.shower===false).length} / ${R('b').filter(l=>l.shower===false).length}</b></div></div>
<div class="g2"><div class="c"><span class="mut">Photos sent</span><b style="font-size:26px">${S.asks.filter(a=>a.proof).length}</b></div><div class="c br"><span class="mut">In our grid</span><b style="font-size:26px">${S.gallery.length}</b></div></div>
<div class="c"><b>Watched</b>${w.map(x=>`<span>${x}</span>`).join('')||'<span class="mut">Nothing logged yet.</span>'}</div><button class="pill ln" data-a="signout" style="color:var(--mut)">Sign out</button>`}

function pics(){const g=S.gallery,n=p=>g.filter(x=>x.by==p).length,ot=oth();
return`${head('Our <em>photos</em>',g.length?`${g.length} photo${g.length>1?'s':''} · ${n('a')} from ${N.a} · ${n('b')} from ${N.b}`:'one grid, both of you')}
<div class="c pk" data-sec="gal"><div class="row sp"><div><b style="font-size:22px">Add to our grid</b><div class="mut">Photos from both of you land here.</div></div>${ic('grid',28)}</div><label class="pill" style="cursor:pointer">${ic('cam',20)}Choose photos<input type="file" accept="image/*" multiple data-f="gal"></label></div>
${g.length?`<div class="gg">${g.map((x,i)=>`<button class="gt${tmp.fx=='gal'&&i<tmp.nn?' fresh':''}" data-a="pv:${x.id}" aria-label="Photo from ${N[x.by]}">${im(x.img,'','',1)}${av(x.by,22)}</button>`).join('')}</div>`:'<div class="mut" style="text-align:center;margin:24px 0">No photos yet. Add the first one.</div>'}`}

function pair(){if(tmp.loading)return`<div class="sentwrap"><div class="mut">Loading…</div></div>`;const w=tmp.lw;
return`<div style="display:grid;gap:16px;padding-top:30px"><div class="row" style="gap:0">${fl('#FCDCE6',120,'moon')}<span style="margin-left:-22px">${fl('#FBE48F',120,'sun')}</span></div><h1 style="font-size:52px">Just <em>us two</em></h1><div class="mut" style="font-size:17px">A small app for exactly two people. Nobody else gets in.</div>
<div class="g2">${['a','b'].map(p=>`<button class="c ${p=='a'?'pk':'yl'}" style="justify-items:start;${w==p?'outline:3px solid #5A0F1E;outline-offset:2px':''}" data-a="pick:${p}">${av(p,40)}<b style="font-size:20px">${DEF[p]}</b></button>`).join('')}</div>
<input class="inp" type="password" data-i="pw" placeholder="Password" autocomplete="current-password" value="${(tmp.pw||'').replace(/"/g,'&quot;')}"><button class="pill pp" style="height:56px" data-a="signin">Sign in</button>${tmp.err?`<div class="mut" style="text-align:center">${tmp.err}</div>`:''}</div>`}

function sheets(){let h='';
if(tmp.sheet=='add')h=`<div class="sh" data-a="sheet:"><div data-stop><h2 style="margin:0">Quick add</h2><div class="q"><button style="background:var(--pink)" data-a="go:eat">${ic('fork',28)}Meal</button><button style="background:var(--yel)" data-a="qw">${ic('drop',28)}Water +1</button><button style="background:var(--pink2)" data-a="qc">${ic('cup',28)}Coffee +1</button><button style="background:var(--card);color:var(--ink)" data-a="go:sleep">${ic('moon',28)}Sleep</button><button style="background:var(--card);color:var(--ink)" data-a="go:wrap">${ic('book',28)}Wrap-up</button><button style="background:var(--yel)" data-a="sheet:ask">${ic('plus',28)}New ask</button><button style="background:var(--pink2);grid-column:1/-1" data-a="go:gal">${ic('grid',28)}Our photos</button></div></div></div>`;
if(tmp.sheet=='name')h=`<div class="sh" data-a="sheet:"><div data-stop><h1 style="font-size:28px">Name your <em>person</em></h1><div class="mut">What do you call them? This name shows on both phones, including their own greeting and notifications.</div><input class="inp" data-i="nm" maxlength="20" value="${esc(tmp.nm||'')}" placeholder="${DEF[oth()]}"><div class="row"><button class="pill" style="flex:1" data-a="rename">Save</button><button class="pill ln" data-a="sheet:">Cancel</button></div></div></div>`;
if(tmp.sheet=='ask')h=`<div class="sh" data-a="sheet:"><div data-stop><h1 style="font-size:28px">Ask <em>${N[oth()]}</em> to…</h1><textarea rows="3" data-i="na" placeholder="Take a walk after dinner">${tmp.na}</textarea><div class="row"><button class="pill ${tmp.daily?'lt':''}" style="flex:1" data-a="dly:0">Just once</button><button class="pill ${tmp.daily?'':'lt'}" style="flex:1" data-a="dly:1">Every day</button></div><div class="row">${['8 pm','9 pm','10 pm'].map(x=>`<button class="pill ${tmp.when==x?'':'lt'}" style="flex:1;padding:0" data-a="when:${x}">${x}</button>`).join('')}</div><div class="it" style="justify-content:space-between"><div><b>Photo proof</b><div class="mut">${N[oth()]} snaps a photo when it’s done</div></div><button class="sw ${tmp.req?'on':''}" role="switch" aria-checked="${tmp.req}" aria-label="Photo proof" data-a="req"></button></div><button class="pill" data-a="mkask">Send ask to ${N[oth()]}</button></div></div>`;
if(tmp.proof)h=`<div class="sh" data-a="sheet:"><div data-stop><h1 style="font-size:28px">Show <em>${N[oth()]}</em></h1><div class="mut">${S.asks.find(a=>a.id==tmp.proof).text}</div>${tmp.pp?`<img class="ph" src="${tmp.pp}" alt="Your proof photo"><button class="pill lt" style="border:1px solid var(--line)" data-a="keep:pp">${ic('grid',20)}Save to my Photos</button>`:`<label class="c" style="background:linear-gradient(160deg,#8A1C30,#2A0813);color:#FFE9EE;border:0;min-height:260px;place-items:center;align-content:center;text-align:center;cursor:pointer">${ic('cam',44)}<b>Tap to open the camera</b><span class="mut">The time gets stamped on the photo</span><input type="file" accept="image/*" capture="environment" data-f="proof" style="display:none"></label>`}<div class="row"><button class="pill" style="flex:1;${tmp.pp?'':'opacity:.4'}" data-a="send" ${tmp.pp?'':'disabled'}>Send proof</button><button class="pill ln" data-a="sheet:">Cancel</button></div></div></div>`;
if(tmp.view){const g=S.gallery.find(x=>x.id==tmp.view);if(g)h=`<div class="sh" data-a="pvx"><div data-stop><div class="row sp"><div class="row">${av(g.by,40)}<div><b>${N[g.by]}</b><div class="mut">${new Date(g.t).toLocaleString([],{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}</div></div></div><button class="rb lt" data-a="pvx" aria-label="Close">×</button></div>${im(g.img,'ph','Photo from '+N[g.by],0,'height:auto;max-height:64dvh;object-fit:contain')}${keepBtn(g.img)}${g.by==S.me?(tmp.pc==g.id?`<div class="it" style="justify-content:space-between"><b>Delete for both of you?</b><div class="row" style="gap:8px"><button class="pill" style="height:40px;padding:0 16px" data-a="pdel:${g.id}">Delete</button><button class="pill ln" style="height:40px;padding:0 16px" data-a="pno">Keep</button></div></div>`:`<button class="pill ln" data-a="pask:${g.id}">Delete photo</button>`):`<div class="mut" style="text-align:center">Added by ${N[g.by]}</div>`}</div></div>`}
return h}

const ask=id=>S.asks.find(a=>a.id==id);
const fin=(id,img)=>{const a=ask(id);a.state='done';a.proof=img;a.at=clock();a.d++;a.ok=false;tmp.proof=null;tmp.pp=null;tmp.ppp=null;toast('Proof sent')};
const shrink=(f,stamp,mx=640)=>new Promise(res=>{const i=new Image;i.onerror=()=>res(null);i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;const x=c.getContext('2d');x.drawImage(i,0,0,c.width,c.height);if(stamp){const t=new Date().toLocaleString([],{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}),fs=Math.round(c.width/20);x.font='700 '+fs+'px sans-serif';x.fillStyle='rgba(0,0,0,.5)';x.fillRect(0,c.height-fs*1.9,c.width,fs*1.9);x.fillStyle='#fff';x.fillText(t,fs*.6,c.height-fs*.6)}res(c.toDataURL('image/jpeg',.72))};i.src=URL.createObjectURL(f)});
const A={
go:v=>{tmp.scr=v;tmp.sheet=null;scrollTo(0,0)},pick:v=>{tmp.lw=v;tmp.err=''},signin:()=>{login()},day:v=>{S.day=v},
who:()=>{tmp.nm=RAW[oth()];tmp.sheet='name'},rename:()=>{const x=(tmp.nm||'').trim().slice(0,20);if(!x)return toast('Type a name first');S.nicks[oth()]=x;applyNicks();tmp.sheet=null;toast(`Now called ${x}`)},keep:v=>{keepPhoto(v)},
w:v=>{const l=L();l.water=Math.max(0,l.water+ +v);tmp.fx=+v>0?'w':null},cof:()=>{L().coffee.push({t:clock()});tmp.fx='cof';toast('Coffee logged')},
sh:v=>{L().shower=v=='y';tmp.fx='sh'},mc:v=>{L().mc=v=='y';tmp.fx='mc'},
meal:()=>{const x=tmp.mt.trim();if(!x&&!tmp.mp)return toast('Add a few words or a photo');L().meals.push({t:clock(),x,img:tmp.mpp||null});tmp.mt='';tmp.mp=null;tmp.mpp=null;tmp.fx='meal';toast('Meal added')},
saved:()=>{tmp.fx='saved';toast('Saved');tmp.scr='today';scrollTo(0,0)},
snap:v=>{tmp.proof=+v;tmp.pp=null;tmp.ppp=null},done:v=>fin(+v,null),send:()=>fin(tmp.proof,tmp.ppp),
miss:v=>{const a=ask(+v);a.state='missed';a.m++;toast('Marked not today')},nudge:()=>toast(`Nudged ${N[oth()]}`),
ok:v=>{ask(+v).ok=true;toast('Approved')},no:v=>{const a=ask(+v);a.state='open';a.proof=null;a.d=Math.max(0,a.d-1);toast(`Sent back to ${N[oth()]}`)},
sheet:v=>{tmp.sheet=v||null;tmp.proof=null},qw:()=>{L().water++;tmp.fx='w';tmp.scr='today';tmp.sheet=null;toast('Glass added')},qc:()=>{L().coffee.push({t:clock()});tmp.fx='cof';tmp.scr='today';tmp.sheet=null;toast('Coffee logged')},
dly:v=>{tmp.daily=v=='1'},when:v=>{tmp.when=v},req:()=>{tmp.req=!tmp.req},
mkask:()=>{const x=tmp.na.trim();if(!x)return toast('What would you like to ask?');S.asks.push({id:Date.now(),from:S.me,to:oth(),text:x,daily:tmp.daily,time:tmp.when,photo:tmp.req,state:'open',d:0,m:0});tmp.na='';tmp.sheet=null;tmp.scr='asks';toast(`Sent to ${N[oth()]}`)},

const dataBlob=d=>{const[h,b]=d.split(','),m=h.match(/:(.*?);/)[1],s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new Blob([u],{type:m})};

function putImg(d){const id=`${S.me}/${Date.now()}-${Math.random().toString(36).slice(2,8)}`,p=id+'.jpg';
 const job=(async()=>{const th=await thumbOf(d),bk=sb.storage.from('photos');

async function hydrate(){const els=[...document.querySelectorAll('img[data-p]:not([src])')];if(!els.length)return;
 const key=e=>e.dataset.t?e.dataset.p.replace(/\.jpg$/,'_t.jpg'):e.dataset.p;

function ap(k,v,del){const[t,x,y]=k.split(':');let j=null;
 if(!del){j=norm(k,v);if(synced.get(k)===j)return false}
 if(t=='log'){if(del)return false;(S.logs[x]??={a:E(),b:E()})[y]={...E(),...v}}
 else if(t=='ask'){S.asks=S.asks.filter(a=>a.id!=x);if(!del)S.asks.push(v);S.asks.sort((a,b)=>a.id-b.id)}
 else if(t=='photo'){S.gallery=S.gallery.filter(g=>g.id!=x);if(!del)S.gallery.push(v);S.gallery.sort((a,b)=>b.id-a.id)}
 else if(t=='nick'){if(del)delete S.nicks[x];else S.nicks[x]=v.n;applyNicks()}
 else if(t=='ping'){S.ping=del?null:v;tmp.inbox=S.ping&&!(S.ping.hid||{})[S.me]&&Date.now()-S.ping.id<216e5?S.ping:null}
 if(del)synced.delete(k);else synced.set(k,j);return true}

 for(const[k,v]of cur){if(k.startsWith('photo:')&&synced.has(k))continue;const j=JSON.stringify(v);if(synced.get(k)!==j&&!(j==EMP&&!synced.has(k)))up.push({key:k,val:v,j})}
 for(const k of synced.keys())if(!cur.has(k))del.push(k);
 up.forEach(u=>{synced.set(u.key,u.j);mine.set(u.j,Date.now())});del.forEach(k=>synced.delete(k));
 if(up.length){const{error}=await sb.from('kv').upsert(up.map(u=>({key:u.key,val:u.val,updated_at:new Date().toISOString()})));
